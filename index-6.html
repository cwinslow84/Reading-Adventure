const $=x=>document.getElementById(x);const pick=a=>a[Math.floor(Math.random()*a.length)];function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function randomOther(a,exclude,n){return shuffle(a.filter(x=>!exclude.includes(x))).slice(0,n)}const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function optionSpeech(a){return String(a).replace(/\s*\/\s*/g,' ').replace(/[_]/g,' blank ')}
function fullPrompt(c){
  // One narration pass: story (if present), question ONCE, then each choice ONCE.
  const parts=[];
  if(c.story)parts.push(c.story,700);
  parts.push(c.story ? c.question : (c.spoken||c.question),850);
  c.options.forEach((answer,i)=>{
    // Speak the choice number as a separate utterance so it never merges
    // into short answers like the individual letter F.
    parts.push(`Choice ${['one','two','three','four'][i]}.`);
    parts.push(400);
    parts.push(optionSpeech(answer));
    if(i<c.options.length-1)parts.push(800);
  });

function home(){stopSpeech();mode='home';$('app').innerHTML=`<div class="top"><span class="logo">🌈 Cade's Reading Adventure</span><button class="pill" id="parents">⚙️ Grown-ups</button></div><section class="hero"><div class="mascot">🦊🚀⭐</div><h1>Ready for an adventure?</h1><p class="subtitle">Little games. Big reading powers!</p><div class="stats"><span class="stat">⭐ ${state.stars} stars</span><span class="stat">🏆 ${state.played} games played</span></div><div class="grid"><button class="button green" id="solo">🎧 Play by Myself</button><button class="button pink" id="together">👨‍👩‍👦 Play Together</button></div><p class="subtitle" style="font-size:15px">${playStyle==='solo'?'🎧 Independent: spoken questions and big buttons':'👨‍👩‍👦 Together: parent coaching and conversation prompts'}</p><button class="button ghost full" id="start">🎲 Surprise me! (5 questions)</button></section><div class="head"><h2>Choose an adventure</h2></div><div class="grid">${CATS.map(([id,name,emoji,desc])=>`<button class="tile" data-cat="${id}"><span class="emoji">${emoji}</span><strong>${name}</strong><small>${desc}</small></button>`).join('')}</div><p class="footer">Made for Cade 💙 • Solo or together • Works offline • Progress stays on this device</p>`;$('solo').onclick=()=>{playStyle='solo';start('mix')};$('together').onclick=()=>{playStyle='together';start('mix')};$('start').onclick=()=>start('mix');$('parents').onclick=parents;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>start(b.dataset.cat))}
function q(id,topic,question,options,answer,art='',story='',spoken=''){
  // Guarantee four DISTINCT answers with exactly one correct answer.
  const pools={
    sounds:[...new Set([...RHYMES.flat(),...LETTERS.map(x=>x[1])])],
    phonics:'abcdefghijklmnopqrstuvwxyz'.split(''),
    sight:SIGHT.map(x=>x.toLowerCase()),

    facts:[...new Set([...ANIMALS.map(x=>x[1]),...ANIMALS.map(x=>x[3])])]

  let choices=[answer,...options.filter(x=>x!==answer)];
  choices=[...new Set(choices)];
  if(choices.length<4)choices.push(...shuffle((pools[topic]||[]).filter(x=>!choices.includes(x))).slice(0,4-choices.length));

function generate(topic){let t=topic==='mix'?pick(['sounds','sounds','phonics','phonics','sight','vocab','stories','facts']):topic;
if(t==='sounds'){
 if(Math.random()<.62){let group=pick(RHYMES),anchor=pick(group),right=pick(group.filter(x=>x!==anchor)),wrong=randomOther(RHYMES.flat().filter(w=>!group.includes(w)),[],3);let opts=[right,...wrong];return q(`rh:${anchor}:${right}`,t,`Which word rhymes with ${anchor}?`,opts,right,ART[anchor]||'🎵','',`Which word rhymes with ${anchor}?`)}

 let [who,emoji]=pick(CHARACTERS),[place,placeArt]=pick(PLACES),[obj,short,objArt]=pick(OBJECTS),action=pick(['found','carried','lost and then found','shared']),text=`${who} went to ${place}. ${who} ${action} ${obj}. After that, ${who} went home feeling happy.`;let which=pick(['who','where','what']);if(which==='who'){let wrong=randomOther(CHARACTERS.map(x=>x[0]),[who],3);return q(`story:${who}:${place}:${short}:who:${action}`,t,'Who went on the adventure?',[who,...wrong],who,emoji,text,'Who went on the adventure?')}if(which==='where'){let wrong=randomOther(PLACES.map(x=>x[0]),[place],3);return q(`story:${who}:${place}:${short}:where:${action}`,t,'Where did the adventure happen?',[place,...wrong],place,placeArt,text,'Where did the adventure happen?')}let wrong=randomOther(OBJECTS.map(x=>x[1]),[short],3);return q(`story:${who}:${place}:${short}:what:${action}`,t,'What did they have?',[short,...wrong],short,objArt,text,'What did they have?')

 '⭐ You listened carefully!','🎈 Nicely done, explorer!','🌈 You solved that one!','🏅 Way to keep learning!',
 '✨ You made a smart choice!','💫 Look at you learning!','🥳 You got it right!','🧠 You used your thinking power!',
 '🌻 You are making progress!','🎯 Right on target!','🐻 That was a clever answer!',
 '🎊 You did it!','🔎 Great detective work!','💪 Your hard work is showing!',
 '🌟 You really thought about that!','🎉 Another challenge completed!'
];
const TRY_AGAIN=[
 '💛 Nice try! We are learning together.',
 '🌱 That was a good try. Practice helps us grow!',
 '🦊 Keep exploring! Each try helps you learn.',
 '💙 Thanks for giving it a try! You can learn this.',
 '🌈 Not quite this time, but you are practicing!',
 '✨ Mistakes help us learn. Keep going!'
];
let previousFeedback='';
function newFeedback(pool){let choices=pool.filter(x=>x!==previousFeedback);let result=pick(choices.length?choices:pool);previousFeedback=result;return result}
function respond(button,chosen){if(answered)return;answered=true;stopSpeech();const right=chosen===current.answer;let info=state.by[current.topic]||{attempts:0,correct:0};info.attempts++;if(right){info.correct++;score++;state.stars+=2}else{state.stars+=1}state.by[current.topic]=info;state.correct+=right?1:0;state.recent.push(current.id);state.recent=state.recent.slice(-120);persist();document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(current.options[Number(b.dataset.i)]===current.answer)b.classList.add('correct')});if(!right)button.classList.add('wrong');const message=newFeedback(right?PRAISE:TRY_AGAIN);$('feedback').textContent=right?message:`${message} The answer is “${current.answer}.”`;$('next').classList.remove('hidden');speakFeedback(right?message.replace(/^[^A-Za-z]+/,''):`${message.replace(/^[^A-Za-z]+/,'')} The correct answer is ${optionSpeech(current.answer)}.`)}
function finish(){stopSpeech();mode='finish';state.played++;persist();$('app').innerHTML=`<div class="top"><button class="back" id="back">← Home</button></div><section class="hero"><div class="mascot">🏆🦊🎉</div><h1>Adventure complete!</h1><div class="stars">${'⭐'.repeat(Math.max(1,score))}</div><p class="subtitle">You got <b>${score} out of 5</b> right! Every answer helped you practice.</p><div class="stats"><span class="stat">🌟 +${5+score} stars earned</span><span class="stat">⭐ ${state.stars} total</span></div><button class="button green full" id="again">🎲 New questions!</button><div style="height:13px"></div><button class="button ghost full" id="home">Choose another adventure</button></section>`;$('back').onclick=home;$('home').onclick=home;$('again').onclick=()=>start(cat)}
function parents(){stopSpeech();mode='parents';$('app').innerHTML=`<div class="top"><button class="back" id="back">← Home</button><span class="pill">👨‍👩‍👦 Parent dashboard</span></div><section class="hero"><h1>Learning progress 📈</h1><p class="subtitle">Progress is stored only on this device. Accuracy reflects game answers, not a school diagnostic.</p><div class="stats"><span class="stat">⭐ ${state.stars} stars</span><span class="stat">🏆 ${state.played} games</span></div>${CATS.map(([id,name])=>{let s=state.by[id]||{attempts:0,correct:0},pct=s.attempts?Math.round(s.correct/s.attempts*100):0;return `<div class="report"><b>${name}</b><span style="float:right">${s.attempts?`${pct}%`:'Not played'}</span><div class="bar"><div style="width:${pct}%"></div></div><span class="small">${s.correct} correct / ${s.attempts} tried</span></div>`}).join('')}<p class="small">Tip: Play a different category each day. Reading aloud together is just as valuable as screen-based practice.</p><button class="adult" id="reset">Reset local progress</button></section>`;$('back').onclick=home;$('reset').onclick=()=>{if(confirm('Erase all game progress on this device?')){state={stars:0,played:0,correct:0,by:{},recent:[]};persist();parents()}}}
home();if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script></body></html>
